apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: network-buoy

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

# Override image tag per environment:
#   kustomize edit set image REGISTRY/network-buoy=REGISTRY/network-buoy:v1.2.3
images:
  - name: REGISTRY/network-buoy
    newTag: latest
