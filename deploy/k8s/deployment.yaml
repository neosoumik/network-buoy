apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-buoy
  namespace: network-buoy
  labels:
    app: network-buoy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-buoy
  template:
    metadata:
      labels:
        app: network-buoy
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: network-buoy
          image: REGISTRY/network-buoy:latest
          imagePullPolicy: Always
          env:
            - name: HONEYPOT_LOG
              value: /data/honeypot.log
            # Set INGEST_URL to forward events to any HTTP endpoint.
            # API_TOKEN is optional — sent as: Authorization: ApiToken <token>
            # - name: INGEST_URL
            #   value: "https://<your-ingest-endpoint>/..."
            # - name: API_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: network-buoy-secrets
            #       key: api-token
            # NODE_ID: stable per pod — use the pod name so each replica
            # has a consistent identity across its own restarts.
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 21
            - containerPort: 22
            - containerPort: 23
            - containerPort: 25
            - containerPort: 80
            - containerPort: 110
            - containerPort: 143
            - containerPort: 389
            - containerPort: 443
            - containerPort: 445
            - containerPort: 3306
            - containerPort: 3389
            - containerPort: 5432
            - containerPort: 6379
            - containerPort: 6443
            - containerPort: 8080
            - containerPort: 9090
            - containerPort: 9200
            - containerPort: 27017
          volumeMounts:
            - name: logs
              mountPath: /data
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: network-buoy-logs
