[project]
name = "network-buoy"
version = "0.1.0"
description = "Network honeypot that listens on common ports and logs connection attempts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "ruff>=0.9",
    "mypy>=1.10",
    "pytest>=9.0.3",
]

[tool.ruff]
line-length = 110

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "SIM108", # ternary operator — sometimes less readable
]

[tool.ruff.lint.isort]
known-first-party = ["buoy", "forwarders"]

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
