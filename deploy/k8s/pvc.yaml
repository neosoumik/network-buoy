apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: network-buoy-logs
  namespace: network-buoy
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  # Remove storageClassName to use cluster default, or set to "gp2" for EKS
  # storageClassName: gp2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: network-buoy-ollama
  namespace: network-buoy
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  # storageClassName: gp2
