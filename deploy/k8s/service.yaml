apiVersion: v1
kind: Service
metadata:
  name: network-buoy
  namespace: network-buoy
  labels:
    app: network-buoy
  annotations:
    # For AWS EKS: makes this a Network Load Balancer so all TCP ports work
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: network-buoy
  ports:
    - name: ftp
      port: 21
      targetPort: 21
    - name: ssh
      port: 22
      targetPort: 22
    - name: telnet
      port: 23
      targetPort: 23
    - name: smtp
      port: 25
      targetPort: 25
    - name: http
      port: 80
      targetPort: 80
    - name: pop3
      port: 110
      targetPort: 110
    - name: imap
      port: 143
      targetPort: 143
    - name: ldap
      port: 389
      targetPort: 389
    - name: https
      port: 443
      targetPort: 443
    - name: smb
      port: 445
      targetPort: 445
    - name: mysql
      port: 3306
      targetPort: 3306
    - name: rdp
      port: 3389
      targetPort: 3389
    - name: postgresql
      port: 5432
      targetPort: 5432
    - name: redis
      port: 6379
      targetPort: 6379
    - name: kubernetes-api
      port: 6443
      targetPort: 6443
    - name: jenkins
      port: 8080
      targetPort: 8080
    - name: prometheus
      port: 9090
      targetPort: 9090
    - name: elasticsearch
      port: 9200
      targetPort: 9200
    - name: mongodb
      port: 27017
      targetPort: 27017
